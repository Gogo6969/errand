[package]
name = "errand-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
futures-util = "0.3.34"
tracing = "0.1.44"
libc = "0.2.189"
eventsource-stream = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1.26.0", features = ["v4"] }
unicode-segmentation = "1.13"
local-ip-address = "0.6.13"
tiktoken-rs = "0.12.0"
once_cell = "1.21.4"
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
chrono-tz = "0.10"
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDate", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKTypes"] }
