[package]
name = "errand-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "errand_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
errand-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationResponse", "UNNotification", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSBundle", "NSThread"] }
objc2 = "0.6.4"
block2 = "0.6.2"
chrono = "0.4.45"
anyhow.workspace = true
uuid = { version = "1.26.0", features = ["v4"] }
base64 = "0.22"
