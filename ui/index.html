<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Errand</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!--
      No framework and no build step, on purpose. This window is a list of
      threads, a list of messages and a box to type in; a toolchain to render
      that is a toolchain to keep working, and it would mean the app could not
      be built without node. When it earns one it can have one.
    -->
    <aside id="side">
      <header>
        <input
          id="find"
          type="search"
          placeholder="Search"
          autocomplete="off"
          aria-label="Search every errand"
        />
        <button id="new" title="Start something new">+</button>
      </header>
      <ol id="threads"></ol>
      <footer id="who">Errand</footer>
    </aside>

    <main>
      <header id="title">
        <span id="mark"></span>
        <button id="thread-name" type="button" title="Who this is">Nothing open</button>
        <button id="pin" type="button" title="Keep at the top">Pin</button>
        <button id="hide" type="button" title="Out of the way, still running">Hide</button>
        <select id="engine" title="What answers this thread"></select>
        <button id="reach" type="button" title="What this thread can reach">Tools</button>
      </header>

      <!--
        What the thread can reach, opened rather than always on screen: finding
        out means starting the servers to ask them, which takes seconds.
      -->
      <!-- Who this agent is, and a way to overrule what it decided. -->
      <aside id="whois" hidden>
        <label>Name <input id="whois-name" type="text" autocomplete="off" /></label>
        <label>Role <input id="whois-title" type="text" autocomplete="off" /></label>
        <label>Handles <input id="whois-about" type="text" autocomplete="off" /></label>
        <button id="whois-save" type="button">Save</button>
      </aside>

      <aside id="reachable" hidden></aside>

      <ol id="messages" aria-live="polite"></ol>

      <form id="composer">
        <textarea
          id="what"
          rows="1"
          placeholder="What would you like done?"
          autocomplete="off"
        ></textarea>
        <button id="send" type="submit" title="Send">↑</button>
      </form>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
