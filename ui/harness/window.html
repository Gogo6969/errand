<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Errand window, under test</title>
<!-- Never kept. See run.sh: a cached harness reports green on code that is no
     longer there, which is worse than no harness at all. -->
<meta http-equiv="cache-control" content="no-store">
<!--
  Loaded by the script below rather than here, so it can carry the same
  cache-busting query everything else does. Left as a plain link it was the one
  file the browser went on keeping: the stylesheet in the page was three edits
  old, a rule that plainly existed on disk simply was not in it, and every
  measurement taken of the layout was a measurement of the wrong layout.
-->
<style>
  /* The report sits over the window it is reporting on. */
  #report { position: fixed; inset: auto 0 0 0; max-height: 45vh; overflow: auto;
            background: #0c0e12; border-top: 2px solid #e8a850; padding: 10px 14px;
            font: 12px/1.6 ui-monospace, Menlo, monospace; z-index: 9999;
            white-space: pre-wrap; }
  #report .ok { color: #7fd07a; }
  #report .no { color: #f0857d; }
  #report h1 { font-size: 13px; margin: 0 0 6px; color: #e6e8ec; }
</style>
</head>
<body>
<pre id="report">running…</pre>
<script type="module">
  // The real markup, read at run time rather than copied in here.
  //
  // It was copied once, and the copy went stale the same afternoon: an element
  // was added to the window, the harness kept testing the version without it,
  // and the page it was supposedly checking threw on load. A harness that
  // tests yesterday's markup is worse than no harness, because it reports
  // green while doing it.
  // Nothing here may be cached, and that is not a detail. The whole reason
  // this harness reads the real files at run time is that a copy went stale
  // within the hour and reported green while testing markup that no longer
  // existed. An HTTP cache is the same failure wearing a different coat: it
  // was serving an index.html from two edits ago, and the checks passed.
  const fresh = `?at=${Date.now()}`;
  // Before anything is measured or drawn, and waited for: a check that runs
  // against an unstyled page measures nothing worth knowing.
  await new Promise((ready) => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = `../app.css${fresh}`;
    link.onload = ready;
    link.onerror = ready;
    document.head.append(link);
  });
  const page = await (await fetch(`../index.html${fresh}`, { cache: "no-store" })).text();
  const real = new DOMParser().parseFromString(page, "text/html");
  const report = document.getElementById("report");
  // Its own script tags came with it and would run unstubbed.
  real.body.querySelectorAll("script").forEach((s) => s.remove());
  document.body.replaceChildren(...real.body.children, report);

  // A stand-in for the thing that listens, so dictation can be exercised
  // without anybody's microphone being turned on. The real one is a browser
  // capability; what is being tested is what this page does with it.
  window.__HEARD__ = [];
  // Both names, and the unprefixed one especially: a real browser has it, the
  // page prefers it, and without this the harness quietly drives the browser's
  // own recogniser and asks for a microphone nobody wanted turned on.
  window.SpeechRecognition = window.webkitSpeechRecognition = class {
    constructor() {
      this.continuous = false;
      this.interimResults = false;
      this.lang = "";
    }
    start() {
      window.__HEARD__.push("start");
      // The one the window is actually listening with, so a check can make the
      // things a real recogniser does on its own happen: giving up after a
      // stretch of quiet, or being refused the microphone.
      window.__EARS__ = this;
      // Answer the way a real one does: an unsettled guess, then, a moment
      // later, the words. Both in one callback meant the pause a call waits for
      // was armed exactly once and never had to be cancelled and restarted, so
      // nothing here exercised the thing that decides when a call sends.
      setTimeout(() => {
        this.onresult?.({
          resultIndex: 0,
          results: [Object.assign([{ transcript: "check the" }], { isFinal: false })],
        });
      }, 10);
      setTimeout(() => {
        this.onresult?.({
          resultIndex: 0,
          results: [
            Object.assign([{ transcript: "check the invoices" }], { isFinal: true }),
          ],
        });
      }, 120);
    }
    stop() {
      window.__HEARD__.push("stop");
      this.onend?.();
    }
  };

  // A stand-in for the voice, for the same reason as the ears: what is being
  // tested is what this page decides to say, not whether a Mac can say it.
  // Recorded rather than spoken, so a harness run in a room with people in it
  // stays silent.
  window.__SAID__ = [];
  const voice = {
    speaking: false,
    pending: false,
    speak(utterance) {
      window.__SAID__.push(utterance.text);
      voice.speaking = true;
      setTimeout(() => {
        voice.speaking = false;
        utterance.onend?.();
      }, 20);
    },
    cancel() {
      voice.speaking = false;
      voice.pending = false;
      window.__SAID__.push("<cut off>");
    },
  };
  // Defined rather than assigned: on the real thing this is a getter, and an
  // assignment to it does nothing at all and says nothing about having done
  // nothing, which would leave the harness talking out loud.
  Object.defineProperty(window, "speechSynthesis", { value: voice, configurable: true });
  window.SpeechSynthesisUtterance = class {
    constructor(text) {
      this.text = text;
      this.lang = "";
    }
  };

  const { standIn, FIXTURE } = await import(`./harness.js${fresh}`);
  // `?empty` is a copy of Errand nobody has ever used. It is its own mode
  // rather than a check, because a first run is a different page: the window
  // makes an agent for itself and there is nothing else in it, so every check
  // written against the fixture would fail for the right reason and drown the
  // one thing being looked at.
  const brandNew = new URLSearchParams(location.search).has("empty");
  // `?slow` makes opening a conversation take as long as it really does when
  // an engine has to start behind it. That switch is what reproduced a window
  // which drew nothing at all for its first few seconds.
  const slow = new URLSearchParams(location.search).has("slow");
  window.__TAURI__ = standIn(
    brandNew ? { ...FIXTURE, agents: [], conversations: {} } : undefined,
    {},
    slow ? { open_thread: 3000 } : {},
  );

  await import(`../app.js${fresh}`);
  // The page starts itself; give its opening round of awaits a moment to land.
  await new Promise((r) => setTimeout(r, 400));

  const { checks, headerFitsOnOneRow, palette, setupCheck, themes, carryingOn, running, stopping, postures, aiming, whichModels, questionsStillOpen, everythingLinesUp, alreadyRunning, whatItCost, whatItCanReach, dictation, watching, writingItOut, aCall, stepsDoNotOverlap, openingAtLogin, sayingWhatThisIs, repeatingWhatWasAsked, whatElseIsAllowed, whatChangedInThisOne, theMenuOnAnAgent, settingAWatchExplainsItself, firstRun } =
    await import(`./checks.js${fresh}`);
  // A first run is looked at on its own, because there is nothing else in it.
  if (brandNew) {
    const found = firstRun();
    const failed = found.filter((f) => !f.ok);
    report.innerHTML =
      `<h1>${failed.length ? failed.length + " FAILED of " + found.length : "all " + found.length + " passed"}</h1>` +
      found.map((f) => `<span class="${f.ok ? "ok" : "no"}">${f.ok ? "PASS" : "FAIL"}</span>  ${f.what}  <em>(${f.saw})</em>`).join("\n");
    window.__RESULT__ = { passed: found.length - failed.length, failed: failed.length, found };
    throw new Error("first run only");
  }

  const found = checks().concat(
    carryingOn(),
    palette(),
    await setupCheck(),
    await running(),
    await stopping(),
    await postures(),
    await whatItCanReach(),
    await dictation(),
    await watching(),
    await writingItOut(),
    await aCall(),
    await stepsDoNotOverlap(),
    await openingAtLogin(),
    await sayingWhatThisIs(),
    await repeatingWhatWasAsked(),
    await whatElseIsAllowed(),
    await whatChangedInThisOne(),
    await theMenuOnAnAgent(),
    await settingAWatchExplainsItself(),
    await aiming(),
    await whichModels(),
    await questionsStillOpen(),
    await everythingLinesUp(),
    await alreadyRunning(),
    await whatItCost(),
    themes(),
  );
  const header = headerFitsOnOneRow();
  found.push({
    what: "everything in the header is on one row",
    ok: header.rows === 1,
    saw: header.tooNarrowToJudge
      ? `cannot be judged: this window is ${header.at}px, below the width where wrapping is meant to happen. Widen it and run again.`
      : `${header.rows} row(s) at ${header.at}px`,
  });
  found.push({ what: "Tools is inside the header rather than past its edge",
               ok: header.toolsInside, saw: String(header.toolsInside) });

  const failed = found.filter((f) => !f.ok);
  report.innerHTML =
    `<h1>${failed.length ? failed.length + " FAILED of " + found.length : "all " + found.length + " passed"}</h1>` +
    found.map((f) => `<span class="${f.ok ? "ok" : "no"}">${f.ok ? "PASS" : "FAIL"}</span>  ${f.what}  <em>(${f.saw})</em>`).join("\n");
  window.__RESULT__ = { passed: found.length - failed.length, failed: failed.length, found };
</script>
</body>
</html>
