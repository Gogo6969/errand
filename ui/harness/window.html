<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Errand window, under test</title>
<link rel="stylesheet" href="../app.css">
<style>
  /* The report sits over the window it is reporting on. */
  #report { position: fixed; inset: auto 0 0 0; max-height: 45vh; overflow: auto;
            background: #0c0e12; border-top: 2px solid #e8a850; padding: 10px 14px;
            font: 12px/1.6 ui-monospace, Menlo, monospace; z-index: 9999;
            white-space: pre-wrap; }
  #report .ok { color: #7fd07a; }
  #report .no { color: #f0857d; }
  #report h1 { font-size: 13px; margin: 0 0 6px; color: #e6e8ec; }
</style>
</head>
<body>
<pre id="report">running…</pre>
<script type="module">
  // The real markup, read at run time rather than copied in here.
  //
  // It was copied once, and the copy went stale the same afternoon: an element
  // was added to the window, the harness kept testing the version without it,
  // and the page it was supposedly checking threw on load. A harness that
  // tests yesterday's markup is worse than no harness, because it reports
  // green while doing it.
  const page = await (await fetch("../index.html")).text();
  const real = new DOMParser().parseFromString(page, "text/html");
  const report = document.getElementById("report");
  // Its own script tags came with it and would run unstubbed.
  real.body.querySelectorAll("script").forEach((s) => s.remove());
  document.body.replaceChildren(...real.body.children, report);

  // A stand-in for the thing that listens, so dictation can be exercised
  // without anybody's microphone being turned on. The real one is a browser
  // capability; what is being tested is what this page does with it.
  window.__HEARD__ = [];
  // Both names, and the unprefixed one especially: a real browser has it, the
  // page prefers it, and without this the harness quietly drives the browser's
  // own recogniser and asks for a microphone nobody wanted turned on.
  window.SpeechRecognition = window.webkitSpeechRecognition = class {
    constructor() {
      this.continuous = false;
      this.interimResults = false;
      this.lang = "";
    }
    start() {
      window.__HEARD__.push("start");
      // Answer the way a real one does: an unsettled guess, then the words.
      setTimeout(() => {
        this.onresult?.({
          resultIndex: 0,
          results: [Object.assign([{ transcript: "check the" }], { isFinal: false })],
        });
        this.onresult?.({
          resultIndex: 0,
          results: [
            Object.assign([{ transcript: "check the invoices" }], { isFinal: true }),
          ],
        });
      }, 10);
    }
    stop() {
      window.__HEARD__.push("stop");
      this.onend?.();
    }
  };

  const { standIn } = await import("./harness.js");
  // `?slow` makes opening a conversation take as long as it really does when
  // an engine has to start behind it. That switch is what reproduced a window
  // which drew nothing at all for its first few seconds.
  const slow = new URLSearchParams(location.search).has("slow");
  window.__TAURI__ = standIn(undefined, {}, slow ? { open_thread: 3000 } : {});

  await import("../app.js");
  // The page starts itself; give its opening round of awaits a moment to land.
  await new Promise((r) => setTimeout(r, 400));

  const { checks, headerFitsOnOneRow, palette, setupCheck, themes, carryingOn, running, stopping, postures, aiming, whichModels, whatItCanReach, dictation, watching } =
    await import("./checks.js");
  const found = checks().concat(
    carryingOn(),
    palette(),
    await setupCheck(),
    await running(),
    await stopping(),
    await postures(),
    await whatItCanReach(),
    await dictation(),
    await watching(),
    await aiming(),
    await whichModels(),
    themes(),
  );
  const header = headerFitsOnOneRow();
  found.push({
    what: "everything in the header is on one row",
    ok: header.rows === 1,
    saw: header.tooNarrowToJudge
      ? `cannot be judged: this window is ${header.at}px, below the width where wrapping is meant to happen. Widen it and run again.`
      : `${header.rows} row(s) at ${header.at}px`,
  });
  found.push({ what: "Tools is inside the header rather than past its edge",
               ok: header.toolsInside, saw: String(header.toolsInside) });

  const failed = found.filter((f) => !f.ok);
  report.innerHTML =
    `<h1>${failed.length ? failed.length + " FAILED of " + found.length : "all " + found.length + " passed"}</h1>` +
    found.map((f) => `<span class="${f.ok ? "ok" : "no"}">${f.ok ? "PASS" : "FAIL"}</span>  ${f.what}  <em>(${f.saw})</em>`).join("\n");
  window.__RESULT__ = { passed: found.length - failed.length, failed: failed.length, found };
</script>
</body>
</html>
